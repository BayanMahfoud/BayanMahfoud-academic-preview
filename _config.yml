  pronouns:
  bio: "Artificial Intelligence Student & Independent Researcher"
  location: "Syria"
  employer:
  uri: "https://bayanmahfoud.github.io"
  email: "bayanmahfoud10@gmail.com"

  # Academic websites
  academia:
  arxiv:
  googlescholar:
  inspire-hep:
